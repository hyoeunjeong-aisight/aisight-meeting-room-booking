<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Meeting Rooms</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>

body{
margin:0;
background:#f7f7f5;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
color:#2f3437;
}

.app{
max-width:1100px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo-area{
display:flex;
align-items:center;
gap:10px;
}

.logo{
height:50px;
}

.title{
font-size:20px;
font-weight:600;
}

button{
background:#2383e2;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1a6fc1;
}

.room-tabs{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

.roomTab{
background:#e5e7eb;
border:none;
padding:8px 16px;
border-radius:6px;
cursor:pointer;
color:#2f3437;
}

.roomTab.active{
background:#2383e2;
color:white;
}

.room-info{
display:flex;
align-items:center;
gap:10px;
background:white;
border-radius:10px;
padding:12px 18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
font-size:14px;
color:#555;
border-left:4px solid var(--room-color, #2383e2);
}

.room-info .room-name{
font-weight:700;
color:#2f3437;
font-size:15px;
}

.room-info .divider{
color:#ddd;
}

.room-info .capacity-badge{
display:inline-flex;
align-items:center;
gap:6px;
font-weight:600;
color:#2f3437;
background:#f1f3f5;
padding:4px 10px;
border-radius:20px;
}

.room-info .capacity-icon{
font-size:15px;
}

#calendar{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

@media (max-width:768px){

.app{padding:15px;}

.header{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

.logo{height:40px;}

}

.footer{
text-align:center;
font-size:12px;
color:#888;
margin-top:40px;
padding-bottom:20px;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo-area">
<img src="https://github.com/hyoeunjeong-aisight/aisight-meeting-room-booking/blob/main/v3.2/Group%2027.png?raw=true" class="logo">
<span class="title">Meeting Rooms</span>
</div>

<button id="loginBtn">Google Login</button>

</div>

<p id="userInfo"></p>

<div class="room-tabs">
<button class="roomTab active" data-room="1">Room 1</button>
<button class="roomTab" data-room="2">Room 2</button>
<button class="roomTab" data-room="3">Room 3</button>
<button class="roomTab" data-room="4">Room 4(test room)@19F</button>
</div>

<div class="room-info" id="roomInfo">
<span class="room-name" id="roomName">Room 1</span>
<span class="divider">|</span>
<span class="capacity-badge"><span class="capacity-icon">👥</span><span id="roomCapacity">4인실</span></span>
</div>

<div id="calendar"></div>

</div>
<footer class="footer">
© 2026 AIsight. Meeting Room Booking System
</footer>
<script>

const firebaseConfig = {
apiKey:"AIzaSyDwYLPPFyBsAZzHuAFCkH1Z6GrI7_0T8BI",
authDomain:"aisight-meeting-room.firebaseapp.com",
projectId:"aisight-meeting-room"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

let currentRoom = "1";
const isMobile = window.innerWidth < 768

// 방별 색상 매핑 (Room 1~4)
const roomColors = {
  "1":"#2383e2",
  "2":"#22c55e",
  "3":"#f97316",
  "4":"#a855f7"
};

// 방별 이름 및 수용 인원 정보
const roomInfo = {
  "1":{name:"Room 1", capacity:"4인실"},
  "2":{name:"Room 2", capacity:"6인실"},
  "3":{name:"Room 3", capacity:"8인실"},
  "4":{name:"Room 4 (test room) @19F", capacity:"2인실"}
};

function getRoomColor(roomId){
  return roomColors[roomId] || "#6b7280";
}

function updateRoomInfo(roomId){
  const info = roomInfo[roomId] || {name:"Room", capacity:"-"};
  document.getElementById("roomName").innerText = info.name;
  document.getElementById("roomCapacity").innerText = info.capacity;
  document.getElementById("roomInfo").style.setProperty("--room-color", getRoomColor(roomId));
}

document.getElementById("loginBtn").onclick = ()=>{
auth.signInWithPopup(provider);
};

auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("userInfo").innerText =
"Logged in as " + user.displayName;
}
});

const calendarEl = document.getElementById("calendar");

const calendar = new FullCalendar.Calendar(calendarEl,{

initialView: window.innerWidth < 768 ? 'timeGridDay' : 'timeGridWeek',

height:"auto",

allDaySlot:false,
nowIndicator:true,

slotDuration:'00:30:00',
snapDuration:'00:30:00',

slotMinTime:'08:00:00',
slotMaxTime:'18:30:00',

weekends:false,

selectable: !isMobile,
selectMirror:true,
longPressDelay:150,

unselectAuto:false,
selectOverlap:false,
selectMinDistance:5,
dateClick: async function(info){

  if(!isMobile) return;

  const user = auth.currentUser;

  if(!user){
    alert("Google 로그인 먼저 해주세요.");
    return;
  }

  const start = info.dateStr;

  const startDate = new Date(info.date);
  const endDate = new Date(startDate.getTime() + 30*60*1000);
  const end = endDate.toISOString();

  if(!confirm("30분 예약하시겠습니까?")) return;

  const snapshot = await db.collection("bookings")
    .where("room","==",currentRoom)
    .get();

  let conflict=false;

  snapshot.forEach(doc=>{
    const data=doc.data();

    if(!(end<=data.start || start>=data.end)){
      conflict=true;
    }
  });

  if(conflict){
    alert("이미 예약된 시간입니다.");
    return;
  }

  const docRef = await db.collection("bookings").add({
    name:user.displayName,
    email:user.email,
    room:currentRoom,
    start:start,
    end:end
  });

  const color = getRoomColor(currentRoom);

  calendar.addEvent({
    id:docRef.id,
    title:user.displayName,
    start:start,
    end:end,
    backgroundColor:color,
    borderColor:color,
    extendedProps:{email:user.email}
  });

},
select: async function(info){

const user = auth.currentUser;

if(!user){
alert("Google 로그인 먼저 해주세요.");
return;
}

const start = info.startStr;
const end = info.endStr;

if(!confirm("이 시간에 예약하시겠습니까?")){
calendar.unselect();
return;
}

const snapshot = await db.collection("bookings")
.where("room","==",currentRoom)
.get();

let conflict=false;

snapshot.forEach(doc=>{
const data=doc.data();

if(!(end<=data.start || start>=data.end)){
conflict=true;
}
});

if(conflict){
alert("이미 예약된 시간입니다.");
return;
}

const docRef = await db.collection("bookings").add({
name:user.displayName,
email:user.email,
room:currentRoom,
start:start,
end:end
});

const color = getRoomColor(currentRoom);

calendar.addEvent({
id:docRef.id,
title:user.displayName,
start:start,
end:end,
backgroundColor:color,
borderColor:color,
extendedProps:{email:user.email}
});

},

eventClick: async function(info){

const user = auth.currentUser;

if(info.event.extendedProps.email !== user.email){
alert("본인 예약만 삭제할 수 있습니다.");
return;
}

if(!confirm("예약 삭제하시겠습니까?")) return;

await db.collection("bookings").doc(info.event.id).delete();

info.event.remove();

}

});

calendar.render();

async function loadBookings(){

calendar.removeAllEvents();

const snapshot = await db.collection("bookings")
.where("room","==",currentRoom)
.get();

snapshot.forEach(doc=>{

const data = doc.data();

const color = getRoomColor(data.room);

calendar.addEvent({
id:doc.id,
title:data.name,
start:data.start,
end:data.end,
backgroundColor:color,
borderColor:color,
extendedProps:{email:data.email}
});

});

}

loadBookings();
updateRoomInfo(currentRoom);

document.querySelectorAll(".roomTab").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".roomTab")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

currentRoom = btn.dataset.room;

updateRoomInfo(currentRoom);
loadBookings();

});

});

</script>

</body>
</html>
